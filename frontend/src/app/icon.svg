<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: rounded square, matches app's dark panel -->
  <rect width="64" height="64" rx="14" fill="#0e0f12"/>

  <!-- Three staff-line fragments — bold enough to read at 16x16 -->
  <g stroke="#7aa2f7" stroke-width="3" stroke-linecap="round">
    <line x1="10" y1="22" x2="54" y2="22"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
    <line x1="10" y1="42" x2="54" y2="42"/>
  </g>

  <!-- Stacked chord: three notes at the same x-position, the visual idiom
       for "a chord" (multiple pitches sounding together). Slight dark stroke
       around each note keeps them legible against the staff lines at any size. -->
  <g fill="#7aa2f7" stroke="#0e0f12" stroke-width="2">
    <circle cx="42" cy="22" r="6.5"/>
    <circle cx="42" cy="32" r="6.5"/>
    <circle cx="42" cy="42" r="6.5"/>
  </g>
</svg>
